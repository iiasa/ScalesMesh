[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scalesmesh"
version = "0.1.0"
description = "SCALES and MESH models"
authors = [{ name = "Verena Kain", email = "verena.kain@cern.ch" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["scales", "mesh"]
